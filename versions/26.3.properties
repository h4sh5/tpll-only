# Minecraft 26.3 (the Wilderness Bound game drop) - unobfuscated, Mojang names in the jar.
# Versions below are the ones Fabric recommends for this release; see https://fabricmc.net/develop
loom_version=1.19.3
# 26.x needs Loom's no-remap variant: the game jar already carries Mojang's names.
loom_plugin=net.fabricmc.fabric-loom
# the no-remap plugin doesn't define modImplementation
mod_dependency_configuration=implementation
uses_official_mojang_mappings=false

minecraft_version=26.3
loader_version=0.20.1

# fabric-command-api-v2, as bundled in fabric-api 0.165.0+26.3
command_api_version=3.1.2+fcdff87f5d
command_api_min_version=3.0.0

# Bytecode target: 21 keeps one jar runnable on every Java runtime this mod supports
# (Minecraft 26.3 itself runs on Java 25, which runs Java 21 bytecode happily).
java_release=21

# Fabric's version range syntax: "A - B" is NOT an interval; use explicit comparators.
# (26.4 and friends can be added here once they are verified.)
minecraft_range=>=26.3 <26.4
