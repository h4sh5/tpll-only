# Minecraft 1.21.11 - the last obfuscated release, and the last one with Yarn mappings.
# This mod builds against Mojang's official mappings instead, so the exact same source tree
# compiles for 26.x as well.
loom_version=1.19.3
loom_plugin=net.fabricmc.fabric-loom-remap
uses_official_mojang_mappings=true

minecraft_version=1.21.11
loader_version=0.20.1

# fabric-command-api-v2, as bundled in fabric-api 0.141.6+1.21.11
command_api_version=2.4.7+6b42a6003e
command_api_min_version=2.4.0

java_release=21

# Only 1.21.11 is built and tested from this profile. Other 1.21.x releases need their own
# profile (see README) because Mojang renamed classes inside the 1.21 line.
minecraft_range=>=1.21.11 <1.21.12
