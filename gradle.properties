# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Which Minecraft profile to build when -Pmc is not passed.
# Available profiles live in versions/<version>.properties.
mc=26.3

# Mod properties (the "+<mc>" build suffix is appended by build.gradle)
mod_version=1.0.0
mod_id=tpll-only
mod_name=tpll-only
mod_description=Standalone /tpll (teleport by latitude & longitude) and /tpllcalc (preview the resulting coordinates) commands, in the style of TerraPlusPlus. Works in singleplayer and multiplayer; on multiplayer only the server needs the mod.
mod_homepage=https://github.com/BuildTheEarth/terraplusplus
mod_license=MIT
